# AIops reverse proxy: nginx in front of the FastAPI app (service "sentinel" in docker-compose).
# ngrok publishes this server; LAN users reach it on port 80.

# Docker's DNS: re-resolve "sentinel" so a recreated container (new IP) does not cause 502s.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream aiops_app {
    zone aiops_app 64k;
    server sentinel:8000 resolve;
    keepalive 16;
}

# ngrok has a fixed address on the "edge" network (docker-compose.yml). Only its forwarding headers
# are trusted: anyone else could send a fake X-Forwarded-For / X-Forwarded-Proto.
set_real_ip_from 172.28.5.10;
real_ip_header X-Forwarded-For;

map $realip_remote_addr $client_proto {
    172.28.5.10 https;
    default     $scheme;
}

# WebSocket upgrade only when the client asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Slow down password guessing on the public URL: 10 login attempts per minute per visitor (the real
# visitor address for ngrok traffic). Only POSTs are limited, so loading the login page never is.
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=aiops_login:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # AI requests can wait for a deep diagnosis ahead of them (one model call at a time) and then think
    # for minutes themselves, so allow an hour; agent long-polls are much shorter.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location = /login {
        limit_req zone=aiops_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aiops_app;
    }

    location /ws/ {
        proxy_pass http://aiops_app;
    }

    location / {
        proxy_pass http://aiops_app;
    }
}
